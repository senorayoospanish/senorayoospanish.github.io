<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>어느 1년</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEFF5;
  --surface:#F8F9FC;
  --ink:#1A2236;
  --muted:#5A6480;
  --accent:#D9862E;
  --accent-ink:#1A2236;
  --mystery:#6E56CF;
  --line:rgba(26,34,54,.14);
  --figdim:#C3C9D7;
  --figprop:#A6AEC2;
  --stepme:#FBEBD3;
  --serif:'Gowun Batang','Nanum Myeongjo','AppleMyungjo','Batang',serif;
  --sans:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121827;--surface:#1A2133;--ink:#E6E9F2;--muted:#9AA3BA;--accent:#F0A54C;--accent-ink:#121827;--mystery:#A08CF5;--line:rgba(230,233,242,.14);--figdim:#3A4259;--figprop:#4D5672;--stepme:#2C2739;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121827;--surface:#1A2133;--ink:#E6E9F2;--muted:#9AA3BA;--accent:#F0A54C;--accent-ink:#121827;--mystery:#A08CF5;--line:rgba(230,233,242,.14);--figdim:#3A4259;--figprop:#4D5672;--stepme:#2C2739;color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button{font:inherit}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.btn{border:0;border-radius:999px;padding:14px 28px;min-height:48px;background:var(--accent);color:var(--accent-ink);font-family:var(--sans);font-size:16px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn:focus-visible,.choice:focus-visible,.pickc:focus-visible{outline:3px solid var(--mystery);outline-offset:3px}

/* 시작 화면 */
#title.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:28px 28px 36px;text-align:center;overflow-y:auto}
.ring{width:min(60vw,220px);height:auto;color:var(--ink);overflow:visible}
.ring .m{fill:none;stroke:var(--muted);stroke-width:1.5;opacity:.6}
.ring .s{fill:var(--accent);opacity:.16;transition:opacity .6s ease}
.ring .s.lit{opacity:1}
.ring text{font-family:var(--sans);font-size:10px;fill:var(--muted)}
.title{font-family:var(--serif);font-weight:700;font-size:clamp(42px,13vw,56px);line-height:1.1;margin:8px 0 0;letter-spacing:-.01em}
.subtitle{font-family:var(--serif);font-size:17px;color:var(--muted);margin:0 0 10px}
.note{font-size:14px;line-height:1.7;color:var(--muted);margin:6px 0 0}

/* 주인공 선택 */
#who{background:linear-gradient(#19213f,#2b2446);color:#EEF0F7}
#who.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 22px;overflow-y:auto;text-align:center}
#who h2{font-family:var(--serif);font-size:24px;font-weight:700;margin:0}
.picks{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:360px}
.pickc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:200px;padding:18px 10px;border:1px solid rgba(255,255,255,.16);border-radius:90px 90px 16px 16px;background:rgba(255,255,255,.05);color:inherit;cursor:pointer}
.pickc span{font-family:var(--serif);font-size:30px;font-weight:700}
.pickc small{font-size:14px;color:#BBAFF6}
.pickc:active{background:rgba(160,140,245,.16)}
#who .hint{margin:0;font-size:14px;line-height:1.7;color:#AEB5CB}

/* 공략 대상 소개 */
#meet{background:radial-gradient(120% 70% at 50% 18%,#3b2f55 0%,#19213f 72%);color:#EEF0F7}
#meet.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 24px;overflow-y:auto;text-align:center}
#meet .mk{margin:0;font-size:14px;color:#BBAFF6}
.portrait{display:flex;align-items:flex-end;justify-content:center;width:min(54%,210px);aspect-ratio:200/262;overflow:hidden;border:1px solid rgba(255,255,255,.16);border-radius:110px 110px 18px 18px;background:radial-gradient(circle at 50% 42%,rgba(240,165,76,.34),rgba(240,165,76,0) 70%),rgba(255,255,255,.05)}
.portrait svg{display:block;width:100%;height:auto}
#meet h2{margin:2px 0 0;font-family:var(--serif);font-size:34px;font-weight:700}
.profile{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.8;color:#D6DAE7}
.profile b{margin-right:6px;color:#F0A54C}
.heart{margin:0 0 6px;font-size:15px;color:#F0A54C}

/* 이야기 화면 */
#play{background:#10131f;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#bg{position:absolute;inset:0;transition:opacity .3s ease}
#bg.fade{opacity:0}
#bg svg{display:block;width:100%;height:100%}
#sprite{position:absolute;left:50%;bottom:166px;z-index:1;width:min(56%,240px);transform:translateX(-50%);opacity:0;transition:opacity .35s ease;pointer-events:none}
#sprite.on{opacity:1}
#sprite svg{display:block;width:100%;height:auto;filter:drop-shadow(0 14px 18px rgba(0,0,0,.28))}
#chip{position:absolute;top:12px;left:12px;z-index:3;display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:999px;background:rgba(14,17,30,.55);color:#EEF0F7;font-size:13px;font-weight:700}
.pips{display:flex;gap:4px}
.pips i{display:block;width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.28)}
.pips i.done{background:#F0A54C}
#tchip{position:absolute;top:12px;right:12px;z-index:3;display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:rgba(14,17,30,.55);color:#EEF0F7;font-size:13px}
#tchip .tl{color:#AEB5CB}
#tchip b{font-weight:700}
#tchip .th{font-weight:700;color:#F0A54C}
#tchip.flip b{color:#F0A54C}
#quad{position:absolute;left:14px;right:14px;top:58px;bottom:178px;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:22px;background:rgba(10,12,24,.64);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#quad.on{display:flex}
#quad .qcap{margin:0;font-family:var(--serif);font-size:15px;color:#BBAFF6}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 18px;width:min(76%,290px)}
.qcell{display:flex;flex-direction:column;align-items:center;transition:opacity .6s ease}
.qcell svg{display:block;width:100%;height:auto;max-height:21vh}
.qcell span{font-family:var(--serif);font-size:14px;letter-spacing:.3em;padding-left:.3em;color:#BBAFF6}
#quad.lit .qcell{opacity:.3}
#quad.lit .qcell.me{opacity:1}
#dialog{position:absolute;left:10px;right:10px;bottom:10px;z-index:4;min-height:146px;padding:26px 20px 30px;border-radius:22px 22px 22px 6px;background:rgba(14,17,32,.88);color:#EEF0F7;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#name{position:absolute;top:-15px;left:16px;display:none;padding:5px 14px 6px;border-radius:12px 12px 12px 3px;background:#F0A54C;color:#1A2236;font-size:14px;font-weight:700}
#name.on{display:block}
#name.future{background:#A08CF5;color:#16122B}
#text{margin:0;min-height:3.5em;font-family:var(--serif);font-size:17.5px;line-height:1.75;white-space:pre-wrap;word-break:keep-all}
#text.narr{color:#CDD2E2}
#next{position:absolute;right:20px;bottom:12px;width:10px;height:10px;border-right:2px solid #F0A54C;border-bottom:2px solid #F0A54C;transform:rotate(45deg);opacity:0}
#next.on{opacity:1;animation:bob 1.1s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(45deg)}50%{transform:translateY(4px) rotate(45deg)}}
#msg{position:absolute;top:56px;left:12px;right:12px;z-index:5;display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:rgba(248,249,252,.97);color:#1A2236;box-shadow:0 14px 34px rgba(0,0,0,.3);transform:translateY(-170%);transition:transform .45s cubic-bezier(.2,.8,.2,1);pointer-events:none}
#msg.on{transform:translateY(0)}
#msg .av{flex:0 0 38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#6E56CF;color:#fff;font-weight:700;font-size:17px}
#msg .av.known{background:#D9862E}
#msg .av.sys{background:#5A6480}
#msg .from{margin:1px 0 3px;font-size:13px;font-weight:700}
#msg .body{font-size:15px;line-height:1.5;word-break:keep-all}
#monthcard{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;background:rgba(10,12,24,.74);color:#EEF0F7;opacity:0;pointer-events:none;transition:opacity .45s ease}
#monthcard.on{opacity:1;pointer-events:auto}
#monthcard .big{font-family:var(--serif);font-weight:700;font-size:clamp(50px,17vw,76px);line-height:1}
#monthcard .sub{font-family:var(--serif);font-size:16px;color:#C9CEDF}
#monthcard .tap{margin-top:26px;font-size:12px;color:#8E95AC}
#choices{position:absolute;inset:0;z-index:7;display:none;flex-direction:column;justify-content:flex-end;gap:10px;padding:20px 14px 18px;background:linear-gradient(to bottom,rgba(8,10,22,.1),rgba(8,10,22,.8) 42%);cursor:default}
#choices.on{display:flex}
#choices .q{margin:0 4px 4px;font-family:var(--serif);font-size:18px;color:#EEF0F7}
.choice{padding:14px 16px;border:0;border-radius:6px 18px 18px 18px;background:rgba(244,246,251,.96);color:#1A2236;font-family:var(--serif);font-size:16.5px;line-height:1.55;text-align:left;word-break:keep-all;cursor:pointer;box-shadow:0 6px 18px rgba(0,0,0,.22)}
.choice:active{background:#F0A54C}
.rain{animation:rainfall .6s linear infinite}
@keyframes rainfall{from{transform:translateY(0)}to{transform:translateY(36px)}}

/* 엔딩 */
#ending{background:radial-gradient(120% 80% at 50% 28%,#3a2f52 0%,#151a2d 72%);color:#EEF0F7}
#ending.on{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:28px 26px;text-align:center;overflow-y:auto}
#ending .art{width:min(52%,220px)}
#ending .art svg{display:block;width:100%;height:auto}
#ending .who{margin:4px 0 0;font-size:14px;color:#BBAFF6}
#ending .e-name{margin:0 0 4px;font-family:var(--serif);font-size:34px;font-weight:700}
#ending .lines p{margin:0 0 6px;font-family:var(--serif);font-size:17px;line-height:1.8;word-break:keep-all;opacity:0;animation:rise .8s ease forwards}
#ending .closing{margin:12px 0 6px;font-family:var(--serif);font-size:18px;line-height:1.7;color:#F0A54C;word-break:keep-all;opacity:0;animation:rise .8s ease forwards}
#ending .btn{opacity:0;animation:rise .6s ease forwards}
#ending .emsg{display:flex;gap:10px;align-items:flex-start;width:100%;max-width:340px;margin:8px 0 6px;padding:10px 12px;border-radius:16px;background:rgba(248,249,252,.96);color:#1A2236;text-align:left;opacity:0;animation:rise .8s ease forwards}
#ending .emsg .av{flex:0 0 34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#D9862E;color:#fff;font-weight:700;font-size:15px}
#ending .emsg .from{margin:0 0 2px;font-size:12px;font-weight:700}
#ending .emsg .body{font-size:14.5px;line-height:1.5;word-break:keep-all}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 회상 */
#result.on{display:block;overflow-y:auto;padding:28px 20px 44px}
.r-small{margin:0;font-size:14px;color:var(--muted)}
.r-name{margin:4px 0 0;font-family:var(--serif);font-size:38px;font-weight:700;line-height:1.2}
.r-mean{margin:6px 0 0;font-size:16px;color:var(--muted);line-height:1.6}
.r-total{margin:12px 0 0;font-size:15px}
.lineup{margin:22px 0 8px}
.lineup svg{display:block;width:100%;height:auto}
.lu-step{fill:var(--surface)}
.lu-me .lu-step{fill:var(--stepme)}
.lu-other .f-body,.lu-other .f-neck{fill:var(--figdim)}
.lu-me .f-body{fill:var(--ink);stroke:var(--accent);stroke-width:6}
.lu-me .f-neck{fill:var(--ink)}
.lu-other .f-prop{fill:var(--figprop)}
.lu-me .f-prop{fill:var(--accent)}
.lu-other .f-prop-s{fill:none;stroke:var(--figprop);stroke-width:7;stroke-linecap:round}
.lu-me .f-prop-s{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.f-line{fill:none;stroke:var(--bg);stroke-width:3;stroke-linecap:round}
.f-needle{fill:var(--bg)}
.lu-name{font-family:var(--sans);font-size:12px;fill:var(--muted)}
.lu-me .lu-name{fill:var(--ink);font-weight:700}
.capnote{margin:0 0 16px;font-size:14px;line-height:1.7;color:var(--muted)}
.save-hint{margin:0;padding:12px 14px;border-radius:14px;background:var(--surface);font-size:14px;line-height:1.6}
.sec{margin:30px 0 4px;font-family:var(--serif);font-size:21px;font-weight:700}
.dim{padding:16px 0 6px;border-top:1px solid var(--line)}
.dim-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dim-name{font-family:var(--serif);font-size:19px;font-weight:700}
.dim-ses{margin-left:8px;font-size:13px;color:var(--muted)}
.dim-score{font-size:17px;font-weight:700}
.dim-score small{font-size:13px;font-weight:400;color:var(--muted)}
.dpips{display:flex;gap:5px;margin:8px 0 6px}
.dpips i{display:block;width:18px;height:8px;border-radius:2px;background:var(--line)}
.dpips i.on{background:var(--accent)}
.scene{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:10px 0}
.mbadge{display:grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--surface);font-family:var(--serif);font-size:14px;font-weight:700}
.scene-title{margin:2px 0 2px;font-size:14px;font-weight:700;color:var(--muted)}
.scene-pick{margin:0;font-family:var(--serif);font-size:16px;line-height:1.6;word-break:keep-all}
.scene-pt{margin:4px 0 0;font-size:13px;color:var(--muted)}
.scene-pt b{color:var(--ink)}
.disclaimer{margin:24px 0 18px;font-size:13px;line-height:1.7;color:var(--muted)}
.r-actions{display:flex;flex-wrap:wrap;gap:10px}

/* 화면 안 대화상자 */
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(8,10,20,.6)}
#modal.on{display:flex}
.mbox{width:100%;max-width:360px;padding:22px 20px 18px;border-radius:22px;background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.35)}
.mbox h3{margin:0 0 8px;font-family:var(--serif);font-size:21px}
.mbox p{margin:0 0 18px;font-size:15px;line-height:1.65;color:var(--muted);white-space:pre-line;word-break:keep-all}
.mbtns{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  #ending .lines p,#ending .closing,#ending .btn,#ending .emsg{opacity:1}
}
</style>
</head>
<body>
<div id="app">
  <section id="title" class="screen" aria-label="시작">
    <svg class="ring" id="ring" viewBox="0 0 240 240" aria-hidden="true"></svg>
    <h1 class="title">어느 1년</h1>
    <p class="subtitle">여덟 번의 선택, 그리고 한 번의 만남</p>
    <button class="btn" id="btnStart" type="button">시작하기</button>
    <p class="note">정답은 없어요. 가장 나다운 선택을 골라 주세요.<br>15분쯤 걸려요.</p>
  </section>

  <section id="who" class="screen" aria-label="주인공 선택">
    <h2>주인공을 선택하세요</h2>
    <div class="picks">
      <button class="pickc" type="button" data-g="m"><span>남자</span><small>주인공</small></button>
      <button class="pickc" type="button" data-g="f"><span>여자</span><small>주인공</small></button>
    </div>
    <p class="hint">고른 주인공에 따라<br>1년을 함께할 사람이 정해집니다.</p>
  </section>

  <section id="meet" class="screen" aria-label="공략 대상">
    <p class="mk">이번 1년, 당신의 공략 대상</p>
    <div class="portrait" id="portrait"></div>
    <h2>지우</h2>
    <ul class="profile"><li>대학 동기이자 같은 동네 친구</li><li><b>좋아하는 것</b>솔직한 사람, 클라이밍, 늦잠</li></ul>
    <p class="heart">호감도 ♥ ???</p>
    <button class="btn" id="btnBegin" type="button">1년 시작하기</button>
  </section>

  <section id="play" class="screen" aria-label="이야기">
    <div id="bg"></div>
    <div id="sprite"></div>
    <div id="chip"><span id="chipText">프롤로그</span><span class="pips" id="pips"></span></div>
    <div id="tchip"><span class="tl">공략 중</span><b id="tname">지우</b><span class="th" id="theart">♥ ???</span></div>
    <div id="quad"><p class="qcap" id="qcap">가능했던 1년 뒤의 나</p><div class="qgrid" id="qgrid"></div></div>
    <div id="msg"><div class="av" id="msgAv">?</div><div><div class="from" id="msgFrom"></div><div class="body" id="msgBody"></div></div></div>
    <div id="dialog"><div id="name"></div><p id="text"></p><span id="next" aria-hidden="true"></span></div>
    <div id="monthcard"><div class="big" id="mcBig"></div><div class="sub" id="mcSub"></div><div class="tap">화면을 누르면 계속돼요</div></div>
    <div id="choices" role="group" aria-label="선택지"></div>
    <p class="sr" id="srText" aria-live="polite"></p>
  </section>

  <section id="ending" class="screen" aria-label="엔딩"></section>
  <section id="result" class="screen" aria-label="회상"></section>

  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mbox"><h3 id="mTitle"></h3><p id="mBody"></p><div class="mbtns" id="mBtns"></div></div>
  </div>
</div>
<script>
'use strict';

/* ───────── 데이터 ───────── */
const DIMS = {
  lead:   { name: '주도성',   ses: '세션 1' },
  mind:   { name: '마인드셋', ses: '세션 2' },
  motive: { name: '내적 동기', ses: '세션 3' },
  exec:   { name: '실행 전략', ses: '세션 4' }
};
const DIM_ORDER = ['lead', 'mind', 'motive', 'exec'];

// 점수 1~4에 대응하는 '1년 뒤의 나'
const LEVELS = [
  { key: 'follow', name: '따라가는 나', mean: '흐름과 상황에 맡긴다', prop: 'boat' },
  { key: 'endure', name: '버티는 나',   mean: '의지와 노력으로 밀어붙인다', prop: 'bag' },
  { key: 'manage', name: '관리하는 나', mean: '계획하고 기록하며 점검한다', prop: 'note' },
  { key: 'lead',   name: '이끄는 나',   mean: '목적을 먼저 정하고, 환경과 구조를 설계한다', prop: 'compass' }
];

function rng(seed) {
  let s = seed % 2147483647;
  if (s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647;
}

const $ = (id) => document.getElementById(id);
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
const KEY = 'eoneu-1nyeon-v2';
let state = { i: 0, choices: {}, done: false, g: null };
let typing = false, typeTimer = null, fullText = '', curBg = null, lastStepAt = 0;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
}
function fresh(g) { return { i: 0, choices: {}, done: false, g: g || null }; }
// 주인공이 남자면 지우는 여자(F), 여자면 남자(M)
function comp() { return state.g === 'f' ? 'M' : 'F'; }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 저장할 수 없는 환경이면 건너뜀 */ } }
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || typeof s.i !== 'number' || s.i < 0 || s.i >= SCRIPT.length || typeof s.choices !== 'object' || s.choices === null) return null;
    return { i: Math.floor(s.i), choices: s.choices, done: !!s.done, g: (s.g === 'm' || s.g === 'f') ? s.g : 'm' };
  } catch (e) { return null; }
}
function clearSave() { try { localStorage.removeItem(KEY); } catch (e) { /* 건너뜀 */ } }

function showScreen(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id));
}

function openModal(title, body, buttons) {
  $('mTitle').textContent = title;
  $('mBody').textContent = body;
  const box = $('mBtns');
  box.innerHTML = '';
  buttons.forEach((b) => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = 'btn' + (b.ghost ? ' ghost' : '');
    el.textContent = b.label;
    el.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); if (b.onClick) b.onClick(); });
    box.appendChild(el);
  });
  $('modal').classList.add('on');
  const last = box.lastElementChild;
  if (last) setTimeout(() => last.focus(), 30);
}
function closeModal() { $('modal').classList.remove('on'); }
function modalOpen() { return $('modal').classList.contains('on'); }

function buildRing() {
  const svg = $('ring'), cx = 120, cy = 120, r = 88, marked = [1, 3, 5, 6, 7, 9, 10, 12];
  let h = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="currentColor" stroke-opacity=".14"/>`;
  for (let m = 1; m <= 12; m++) {
    const a = (m / 12) * Math.PI * 2 - Math.PI / 2;
    const x = cx + r * Math.cos(a), y = cy + r * Math.sin(a);
    const lx = cx + (r + 19) * Math.cos(a), ly = cy + (r + 19) * Math.sin(a) + 3.5;
    h += marked.includes(m)
      ? `<circle class="s" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8"/>`
      : `<circle class="m" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4"/>`;
    h += `<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${m}</text>`;
  }
  svg.innerHTML = h;
  const dots = Array.from(svg.querySelectorAll('.s'));
  if (REDUCED) { dots.forEach((d) => d.classList.add('lit')); return; }
  dots.forEach((d, k) => setTimeout(() => d.classList.add('lit'), 400 + k * 170));
}

function buildWho() {
  document.querySelectorAll('.pickc').forEach((b) => {
    b.addEventListener('click', () => {
      state = fresh(b.dataset.g);
      $('portrait').innerHTML = svgJiwoo('smile', comp());
      showScreen('meet');
    });
  });
  $('btnBegin').addEventListener('click', startPlay);
}

function spriteAt(i) {
  for (let k = i; k >= 0; k--) {
    const s = SCRIPT[k];
    if (s.t === 'say') return { kind: s.who, face: s.face };

  for (let k = i; k >= 0; k--) {
    const s = SCRIPT[k];
    if (s.t === 'month') return s.scene === 'end' ? '1년 뒤' : s.big;
  }
  return '프롤로그';
}

function revealedAt(i) { for (let k = i; k >= 0; k--) if (SCRIPT[k].reveal) return true; return false; }
function setTarget() {
  const rev = revealedAt(state.i);
  $('tname').textContent = rev ? '나' : '지우';
  $('theart').textContent = rev ? '♥' : '♥ ???';
  $('tchip').classList.toggle('flip', rev);
}
function setQuad(mode) {
  const q = $('quad');
  if (!mode) { q.classList.remove('on'); return; }
  const r = computeResult();
  $('qgrid').innerHTML = LEVELS.map((lv, idx) => {
    const me = mode === 'lit' && idx === r.lv;
    return `<div class="qcell${me ? ' me' : ''}">${svgFuture(lv.prop, me ? 'lit' : 'dark')}<span>???</span></div>`;
  }).join('');
  $('qcap').textContent = mode === 'lit' ? '네 선택이 고른 1년 뒤의 나' : '가능했던 1년 뒤의 나';
  q.classList.toggle('lit', mode === 'lit');
  q.classList.add('on');
}

function setBg(key) {
  if (key === curBg) return;
  curBg = key;
  const el = $('bg');
  if (REDUCED || !el.innerHTML) { el.innerHTML = bgSVG(key); el.classList.remove('fade'); return; }
  el.classList.add('fade');
  setTimeout(() => { if (curBg === key) el.innerHTML = bgSVG(key); el.classList.remove('fade'); }, 280);
}
function setSprite(sp) {
  const el = $('sprite');
  if (!sp) { el.classList.remove('on'); return; }
  const lv = sp.kind === 'future' ? currentLevel() : null;
  const k = sp.kind === 'future' ? 'future-' + lv.prop : 'jiwoo-' + comp() + '-' + (sp.face || 'neutral');
  if (el.dataset.k !== k) {
    el.innerHTML = sp.kind === 'future' ? svgFuture(lv.prop, 'lit') : svgJiwoo(sp.face || 'neutral', comp());
    el.dataset.k = k;
  }
  el.classList.add('on');
}
function setChip() {
  $('chipText').textContent = chipAt(state.i);
  const done = SCENES.filter((sc) => typeof state.choices[sc.id] === 'number').length;
  $('pips').innerHTML = SCENES.map((_, k) => `<i class="${k < done ? 'done' : ''}"></i>`).join('');
}
function setName(who) {
  const el = $('name');
  if (!who) { el.className = ''; el.textContent = ''; return; }
  el.textContent = who === 'future' ? '1년 뒤의 나' : '지우';
  el.className = 'on' + (who === 'future' ? ' future' : '');
}
function typeText(str, narr) {
  clearTimeout(typeTimer);
  const el = $('text');
  el.classList.toggle('narr', !!narr);
  fullText = str;
  $('srText').textContent = str;
  $('next').classList.remove('on');
  if (REDUCED) { el.textContent = str; typing = false; $('next').classList.add('on'); return; }
  typing = true;
  let n = 0;
  el.textContent = '';
  const tick = () => {
    n += 1;
    el.textContent = str.slice(0, n);
    if (n >= str.length) { typing = false; $('next').classList.add('on'); return; }
    typeTimer = setTimeout(tick, 28);
  };
  tick();
}
function finishTyping() {
  clearTimeout(typeTimer);
  $('text').textContent = fullText;
  typing = false;
  $('next').classList.add('on');
}
function showMsg(s) {
  const av = $('msgAv');
  av.className = 'av' + (s.kind === 'known' ? ' known' : s.kind === 'sys' ? ' sys' : '');
  av.textContent = s.kind === 'known' ? '지' : s.kind === 'sys' ? '!' : '?';
  $('msgFrom').textContent = s.from;
  $('msgBody').textContent = s.text;
  $('msg').classList.add('on');
}
function showMonth(s) {
  $('mcBig').textContent = s.big;
  $('mcSub').textContent = s.sub;
  $('monthcard').classList.add('on');
  $('srText').textContent = s.big + ', ' + s.sub;
}
function showChoices(id) {
  const sc = SCENES.find((x) => x.id === id);
  const box = $('choices');
  box.innerHTML = '';
  const q = document.createElement('p');
  q.className = 'q';
  q.textContent = '평소의 나라면?';
  box.appendChild(q);
  sc.opts.forEach((o, idx) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'choice';
    b.textContent = o[0];
    b.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!box.classList.contains('on')) return;
      state.choices[id] = idx;
      box.classList.remove('on');
      next();
    });
    box.appendChild(b);
  });
  box.classList.add('on');
  $('next').classList.remove('on');
  $('srText').textContent = '평소의 나라면? 네 가지 중에서 하나를 골라 주세요.';
}

function run() {
  const s = SCRIPT[state.i];
  if (!s) return;
  lastStepAt = Date.now();
  setBg(bgAt(state.i));
  setChip();
  setTarget();
  if (s.t !== 'msg') $('msg').classList.remove('on');
  if (s.t !== 'month') $('monthcard').classList.remove('on');
  if (s.t !== 'choice') $('choices').classList.remove('on');
  setQuad(s.quad);
  setSprite(s.quad ? null : spriteAt(state.i));
  if (s.t === 'narr') { setName(null); typeText(s.text, true); }
  else if (s.t === 'say') { setName(s.who); typeText(s.text, false); }
  else if (s.t === 'msg') { setName(null); showMsg(s); typeText('띠링.', true); }
  else if (s.t === 'month') {
    setName(null); clearTimeout(typeTimer); typing = false;
    $('text').textContent = ''; $('next').classList.remove('on');
    showMonth(s);
  }
  else if (s.t === 'choice') { showChoices(s.id); }
  else if (s.t === 'ending') { finish(); }
}
function next() {
  if (state.i < SCRIPT.length - 1) { state.i += 1; save(); run(); }
}
function advance() {
  if (!$('play').classList.contains('on') || modalOpen()) return;
  const s = SCRIPT[state.i];
  if (!s || s.t === 'choice' || s.t === 'ending') return;
  if (typing) { finishTyping(); return; }
  if (Date.now() - lastStepAt < 250) return;
  next();
}

/* ───────── 결과 ───────── */
function computeResult() {
  const dim = { lead: 0, mind: 0, motive: 0, exec: 0 };
  let total = 0;
  const picks = SCENES.map((sc) => {
    const idx = state.choices[sc.id];
    const o = (typeof idx === 'number' && sc.opts[idx]) ? sc.opts[idx] : null;
    const pt = o ? o[1] : 0;
    dim[sc.dim] += pt;
    total += pt;
    return { sc, text: o ? o[0] : '선택하지 않았어요', pt };
  });
  const lv = total <= 13 ? 0 : total <= 19 ? 1 : total <= 25 ? 2 : 3;
  return { dim, total, picks, lv, level: LEVELS[lv] };
}
function currentLevel() { return computeResult().level; }

function finish() {
  state.done = true;
  save();
  renderEnding();
  showScreen('ending');
}
function renderEnding() {
  const r = computeResult();
  const lines = ENDINGS[r.level.key];
  const base = 0.7, step = 0.9;
  $('ending').innerHTML = `<div class="art">${svgFuture(r.level.prop, 'lit')}</div>
<p class="who">당신이 만난 1년 뒤의 나</p>
<h2 class="e-name">${esc(r.level.name)}</h2>
<div class="lines">${lines.map((l, k) => `<p style="animation-delay:${(base + k * step).toFixed(2)}s">${esc(l)}</p>`).join('')}</div>
<p class="closing" style="animation-delay:${(base + lines.length * step + 0.4).toFixed(2)}s">${esc(CLOSING)}</p>
<div class="emsg" style="animation-delay:${(base + lines.length * step + 1.4).toFixed(2)}s"><div class="av">지</div><div><div class="from">지우</div><div class="body">새해 복 많이 받아. 올해도 솔직한 너로 지내 줘.</div></div></div>
<button class="btn" id="btnRecall" type="button" style="animation-delay:${(base + lines.length * step + 2.2).toFixed(2)}s">회상 보기</button>`;
  $('btnRecall').addEventListener('click', () => { renderResult(); showScreen('result'); $('result').scrollTop = 0; });
}
function renderResult() {
  const r = computeResult();
  const dims = DIM_ORDER.map((dk) => {
    const d = DIMS[dk], score = r.dim[dk];
    const rows = r.picks.filter((p) => p.sc.dim === dk).map((p) => `<div class="scene"><div class="mbadge">${esc(p.sc.month)}</div><div><p class="scene-title">${esc(p.sc.title)}</p><p class="scene-pick">${esc(p.text)}</p><p class="scene-pt"><b>${p.pt}점</b> ${p.pt ? esc(LEVELS[p.pt - 1].name) : ''}</p></div></div>`).join('');
    const pips = Array.from({ length: 8 }, (_, k) => `<i class="${k < score ? 'on' : ''}"></i>`).join('');
    return `<div class="dim"><div class="dim-head"><div><span class="dim-name">${d.name}</span><span class="dim-ses">${d.ses}</span></div><div class="dim-score">${score}<small> / 8</small></div></div><div class="dpips" aria-hidden="true">${pips}</div>${rows}</div>`;
  }).join('');
  $('result').innerHTML = `<p class="r-small">당신이 만난 1년 뒤의 나</p>
<h1 class="r-name">${esc(r.level.name)}</h1>
<p class="r-mean">${esc(r.level.mean)}</p>
<p class="r-total">32점 중 <b>${r.total}점</b></p>
<div class="lineup">${svgLineup(r.lv)}</div>
<p class="capnote">네 사람은 모두 1년 뒤의 당신이었어요. 점수가 높을수록 오른쪽 사람에 가까워집니다.</p>
<p class="save-hint">강의 중에 이 화면을 다시 봅니다. 지금 캡처해 두세요.</p>
<h2 class="sec">영역별로 보면</h2>
${dims}
<p class="disclaimer">이 결과는 평가가 아니라 오늘 강의의 출발점입니다. 교육용 자기성찰 도구이며, 검증된 심리검사가 아닙니다.</p>
<div class="r-actions"><button class="btn ghost" id="btnReEnd" type="button">엔딩 다시 보기</button><button class="btn ghost" id="btnRestart" type="button">처음부터 다시</button></div>`;
  $('btnReEnd').addEventListener('click', () => { renderEnding(); showScreen('ending'); });
  $('btnRestart').addEventListener('click', confirmRestart);
}
function confirmRestart() {
  openModal('처음부터 다시 할까요?', '지금까지의 선택과 결과가 지워집니다.', [
    { label: '취소', ghost: true },
    { label: '다시 하기', onClick: () => { clearSave(); state = fresh(); showScreen('title'); } }
  ]);
}

function startPlay() {
  state = fresh(state.g || 'm');
  save();
  curBg = null;
  $('sprite').dataset.k = '';
  showScreen('play');
  run();
}
function resumePlay(saved) {
  state = saved;
  curBg = null;
  $('sprite').dataset.k = '';
  showScreen('play');
  run();
}

function boot() {
  buildRing();
  buildWho();
  $('btnStart').addEventListener('click', () => showScreen('who'));
  $('play').addEventListener('click', (e) => {
    if (e.target.closest && e.target.closest('#choices')) return;
    advance();
  });
  document.addEventListener('keydown', (e) => {
    if (!$('play').classList.contains('on') || modalOpen()) return;
    if (e.key !== ' ' && e.key !== 'Enter') return;
    const ae = document.activeElement;
    if (ae && ae.classList && ae.classList.contains('choice')) return;
    e.preventDefault();
    advance();
  });
  showScreen('title');
  const saved = load();
  if (!saved) return;
  if (saved.done) {
    state = saved;
    openModal('이미 1년을 마쳤어요', '회상 화면에서 내 선택과 점수를 다시 볼 수 있어요.', [
      { label: '처음부터 다시', ghost: true, onClick: () => { clearSave(); state = fresh(); } },
      { label: '회상 보기', onClick: () => { renderResult(); showScreen('result'); } }
    ]);
  } else if (saved.i > 0) {
    openModal('이어서 할까요?', `지난번에 ${chipAt(saved.i)}까지 진행했어요.`, [
      { label: '처음부터', ghost: true, onClick: () => { clearSave(); state = fresh(); } },
      { label: '이어하기', onClick: () => resumePlay(saved) }
    ]);
  }
}
boot();
</script>
</body>
</html>
